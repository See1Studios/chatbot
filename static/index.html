<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Sphere · chatbot</title>
  <!--IDENTITY-->
  <link rel="icon" href="/chat/persona/face-icon.webp?v=3" type="image/webp" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/joungkyun/font-d2coding/d2coding.css" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/joungkyun/font-d2coding/d2coding.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
  </noscript>
  <link rel="stylesheet" href="./sphere-theme.css?v=2" />
  <link rel="stylesheet" href="./vendor/highlight-github-dark.min.css" />
  <script>
    (function(){
      try {
        var t = localStorage.getItem('chatbot.themeColor') || 'lime';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e){}
    })();
  </script>
  <link rel="stylesheet" href="./chat.css?v=20" />
</head>
<body>
  <div class="wrap" id="appWrap">
    <header>
      <div class="brand">
        <a id="hubLink" href="/" title="Hub로 이동" aria-label="Hub로 이동"><span class="hub-arrow" aria-hidden="true">←</span><span class="hub-text"> Hub</span></a>
        <div class="brand-avatar-wrap" id="brandAvatarWrap">
          <img class="avatar" id="brandAvatar" src="/chat/persona/providers/agy.webp?v=9" alt="AI 제공자 선택" role="button" tabindex="0" aria-label="AI 제공자 선택" aria-haspopup="menu" aria-expanded="false" title="제공자 변경 (클릭)" onerror="this.onerror=null;this.src='/chat/persona/providers/agy.png';">
          <div class="provider-tray" id="providerTray" hidden role="menu" aria-label="AI 제공자 선택"></div>
        </div>
        <div class="brand-title">
          <h1 id="brandName"></h1>
          <div class="sub" id="brandRole"><span class="brand-provider" id="brandProvider">Antigravity</span></div>
        </div>
      </div>
      <div class="bar">
        <div class="tab-group" role="tablist">
          <button id="tabChat" class="tab-btn on" type="button" role="tab" aria-selected="true" aria-controls="log" title="대화 (Alt+1)">
            <svg class="tab-icon-svg" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span class="tab-label">대화</span>
          </button>
          <button id="tabArtifacts" class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="artifacts" title="아티팩트 (Alt+2)">
            <svg class="tab-icon-svg" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span class="tab-label">아티팩트</span>
          </button>
          <button id="tabActivity" class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="activity" title="로그 (Alt+3)">
            <svg class="tab-icon-svg" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span class="tab-label">로그</span>
          </button>
          <button id="tabStatus" class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="statusPane" title="상태 (Alt+4)">
            <svg class="tab-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span class="tab-label">상태</span>
          </button>
          <button id="tabSessions" class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="sessionsPane" title="세션 (Alt+5)">
            <svg class="tab-icon-svg" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            <span class="tab-label">세션</span>
          </button>
        </div>
        <div class="more-menu-wrap">
          <button id="moreMenuBtn" class="ghost" type="button" title="더 보기 및 테마 설정" aria-haspopup="true" aria-expanded="false">⋯</button>
          <div id="moreMenu" class="more-menu" hidden role="menu">
            <div class="more-menu-header">테마 키컬러</div>
            <div class="theme-swatches" id="themeSwatches">
              <button class="theme-swatch" data-theme-choice="lime" title="Sphere Lime" aria-label="Sphere Lime 테마" type="button"></button>
              <button class="theme-swatch" data-theme-choice="amber" title="Studio Amber" aria-label="Studio Amber 테마" type="button"></button>
              <button class="theme-swatch" data-theme-choice="cyan" title="Electric Cyan" aria-label="Electric Cyan 테마" type="button"></button>
              <button class="theme-swatch" data-theme-choice="emerald" title="Cyber Mint" aria-label="Cyber Mint 테마" type="button"></button>
              <button class="theme-swatch" data-theme-choice="violet" title="Neon Violet" aria-label="Neon Violet 테마" type="button"></button>
              <button class="theme-swatch" data-theme-choice="mono" title="Paper White" aria-label="Paper White 테마" type="button"></button>
              <button class="theme-swatch" data-theme-choice="spark" title="Gemini Spark" aria-label="Gemini Spark 테마" type="button"></button>
            </div>
            <button id="defibBtn" class="more-menu-item" type="button" role="menuitem" title="전기충격 · 심폐소생 — 호스트 repair">
              <span style="display:inline-flex;align-items:center;gap:.45rem">
                <svg class="btn-icon-svg" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                <span>호스트 소생</span>
              </span>
            </button>
          </div>
        </div>
      </div>
    </header>
    <div class="meta" id="meta">
      <div style="display:inline-flex;align-items:center;gap:.5rem;flex-wrap:wrap">
        <div class="session-nav" id="sessionNav" role="group" aria-label="세션 이동 네비게이션">
          <button id="sessionNavPrev" class="session-nav-btn" type="button" title="이전 세션 (과거)" aria-label="이전 세션 (과거)" disabled>
            <svg class="action-icon-svg" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            <span class="nav-label">이전</span>
          </button>
          <button id="sessionNavNext" class="session-nav-btn" type="button" title="다음 세션 (미래)" aria-label="다음 세션 (미래)" disabled>
            <span class="nav-label">다음</span>
            <svg class="action-icon-svg" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button id="sessionNavLatest" class="session-nav-btn highlight" type="button" title="최신 세션으로 점프" aria-label="최신 세션으로 점프" hidden>
            <span>최신 ⇥</span>
          </button>
        </div>
        <span id="metaSessionText">세션 없음</span>
        <span id="pastSessionBadge" class="past-tag" style="display:none">과거 열람</span>
        <span id="procBadge" class="proc-badge idle" title="에이전트 프로세스 실시간 상태"><span class="dot"></span><span id="procBadgeText">대기 중</span></span>
      </div>
      <span id="sessionTokenBadge" class="session-token-badge" style="display:none"></span>
    </div>
    <div id="turnChromeHost" hidden>
      <button id="stopBtn" class="danger turn-stop-btn" type="button" title="작업 중지">
        <svg class="action-icon-svg" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        중지
      </button>
    </div>
    <div id="sessionBanner" class="session-banner" hidden data-mode="quiet" role="region" aria-label="세션 관리">
      <span class="session-banner-msg">세션이 길어져서 느려질 수 있어요. 새 채팅을 권장합니다</span>
      <button id="sessionBannerContinue" class="ghost" type="button">맥락 이어가기</button>
      <button id="sessionBannerNew" class="ghost" type="button">새 대화</button>
      <button id="sessionBannerDismiss" class="ghost" type="button">닫기</button>
    </div>
    <div class="progress" id="progress" hidden></div>
    <div class="stage-shell">
    <div class="stage" role="main">
      <div id="log" role="tabpanel" aria-labelledby="tabChat"></div>
      <div id="artifacts" role="tabpanel" aria-labelledby="tabArtifacts">
        <div class="art-toolbar">
          <div class="art-filters">
            <button class="art-filter-btn on" data-filter="all" type="button">전체</button>
            <button class="art-filter-btn" data-filter="image" type="button">이미지</button>
            <button class="art-filter-btn" data-filter="document" type="button">문서/코드</button>
          </div>
          <button id="artRefreshBtn" class="art-filter-btn" type="button" title="아티팩트 새로고침">새로고침 ↻</button>
        </div>
        <div id="artGrid" class="art-grid"></div>
        <div id="artEmpty" class="art-empty" style="display:none">
          생성된 아티팩트가 없습니다냥 ฅ<br><span style="font-size:.85rem;color:var(--muted)">이미지 생성이나 파일 작업을 요청해보세요!</span>
        </div>
      </div>
      <div id="activityPane" role="tabpanel" aria-labelledby="tabActivity">
        <div class="act-toolbar">
          <div class="act-filters">
            <button class="act-filter-btn on" data-filter="all" type="button">전체</button>
            <button class="act-filter-btn" data-filter="tool" type="button">도구</button>
            <button class="act-filter-btn" data-filter="system" type="button">시스템</button>
            <button class="act-filter-btn" data-filter="warn_error" type="button">경고/오류</button>
            <button class="act-filter-btn" data-filter="token" type="button">토큰</button>
          </div>
          <div class="act-toolbar-right">
            <input type="search" id="actSearchInput" class="act-search-input" placeholder="로그 검색…" aria-label="로그 검색">
            <button id="actCopyBtn" class="act-filter-btn" type="button" title="현재 표시된 로그 복사">복사 📋</button>
            <button id="actRefreshBtn" class="act-filter-btn" type="button" title="로그 새로고침">새로고침 ↻</button>
          </div>
        </div>
        <div id="activity" class="act-scroll"></div>
      </div>
      <div id="statusPane" role="tabpanel" aria-labelledby="tabStatus">
        <section class="status-section" id="statusProviderSection">
          <h2 class="status-head-row">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
            <span id="statusProviderTitle">현재 프로바이더</span>
            <button id="statusRefreshBtn" class="art-filter-btn" type="button" title="상태 새로고침">새로고침 ↻</button>
          </h2>
          <div id="statusProviderPicker" class="provider-chips" role="group" aria-label="상태를 볼 제공자"></div>
          <h3 class="status-subhead">계정</h3>
          <div id="statusAccounts" class="status-list"></div>
          <div class="status-toolbar status-subhead-row">
            <h3 class="status-subhead">사용량 (Usage)</h3>
            <span id="usageCheckedAt" class="status-hint" style="margin:0 0 0 auto"></span>
            <button id="usageRefreshBtn" class="art-filter-btn" type="button" title="사용량 새로고침">새로고침 ↻</button>
          </div>
          <div id="statusSessionTokens" class="status-list" style="margin-top:.4rem"></div>
          <div id="statusUsage" class="status-list" style="margin-top:.5rem"></div>
          <details id="statusProcs" class="status-procs" hidden>
            <summary id="statusProcsSummary">프로세스</summary>
            <div id="statusProcList" class="status-list"></div>
          </details>
        </section>
        <section class="status-section">
          <h2>
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 5 5c0 2.22-1.21 4.16-3 5.2V17a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-4.8C4.21 11.16 3 9.22 3 7a5 5 0 0 1 5-5h4z"/><line x1="9" y1="21" x2="15" y2="21"/></svg>
            <span>장기 기억 (MEMORY.md)</span>
          </h2>
          <div id="statusMemory" class="status-list"></div>
        </section>
        <section class="status-section">
          <h2>
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
            <span>규칙 파일 (Rules)</span>
          </h2>
          <div id="statusRules" class="status-list"></div>
        </section>
        <section class="status-section">
          <h2>
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M20.5 12.5a2.5 2.5 0 0 1-2.5 2.5h-1v1a2.5 2.5 0 0 1-5 0v-1H8a2.5 2.5 0 0 1-2.5-2.5v-4A2.5 2.5 0 0 1 8 6h4v1a2.5 2.5 0 0 0 5 0V6h1a2.5 2.5 0 0 1 2.5 2.5v4z"/></svg>
            <span>프로젝트 스킬 (Skills)</span>
          </h2>
          <div id="statusSkills" class="status-list"></div>
          <div class="status-hint" id="statusSkillLibHint"></div>
        </section>
        <section class="status-section">
          <h2>
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            <span>MCP 서버</span>
          </h2>
          <div id="statusMcp" class="status-list"></div>
          <div class="status-mcp-add">
            <input id="mcpNameInput" type="text" placeholder="이름 (예: graft)" aria-label="MCP 서버 이름">
            <input id="mcpUrlInput" type="text" placeholder="serverUrl (예: http://127.0.0.1:PORT/mcp)" aria-label="MCP 서버 URL">
            <button id="mcpAddBtn" class="art-btn primary" type="button">+ 추가</button>
          </div>
        </section>
        <section class="status-section">
          <h2>
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
            <span>훅 (Hooks) &amp; 플러그인</span>
          </h2>
          <div id="statusHooks" class="status-hint"></div>
        </section>
        <section class="status-section">
          <h2>
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            <span>관찰 (Observations)</span>
          </h2>
          <div id="statusObserver" class="status-hint"></div>
          <div id="statusObsBox"></div>
          <div id="statusTicketBox"></div>
        </section>
      </div>
      <div id="sessionsPane" role="tabpanel" aria-labelledby="tabSessions">
        <div class="status-toolbar" style="justify-content:space-between;align-items:center;gap:.4rem;flex-wrap:wrap">
          <span class="status-hint" style="margin:0">최근 세션 (최대 40개) · 클릭하면 그 세션으로 전환</span>
          <div style="display:flex;gap:.4rem;flex-wrap:wrap;align-items:center">
            <button id="sessionsContinueBtn" class="art-filter-btn" type="button" title="현재 대화 요약 인계받아 새 세션">맥락 이어가기</button>
            <button id="sessionsNewBtn" class="primary" type="button" title="완전 새 세션">새 세션</button>
            <button id="sessionsRefreshBtn" class="art-filter-btn" type="button" title="세션 목록 새로고침">새로고침 ↻</button>
          </div>
        </div>
        <div id="sessionsList" class="status-list"></div>
      </div>
    </div>
    <button id="scrollToBottomBtn" class="scroll-bottom-btn" type="button" aria-label="최신 대화로 이동" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
      <span>최신 대화로</span>
    </button>
    </div>
    <div id="ticketBar" class="ticket-bar" hidden></div>
    <div class="composer">
      <div id="slashMenu" class="slash-menu" role="listbox" aria-label="명령어 및 스킬" hidden></div>
      <div id="modelMenu" class="slash-menu model-menu" role="listbox" aria-label="모델 선택" hidden></div>
      <select id="provider" title="provider"></select>
      <!-- The model is chosen with #modelBtn + #modelMenu (model-picker.js); this <select> stays,
           hidden, as the one source of truth the rest of app.js reads (modelEl.value). -->
      <button id="modelBtn" class="model-trigger-btn" type="button" title="모델 선택" aria-label="모델 선택" aria-haspopup="listbox" aria-expanded="false"><svg class="tab-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg></button>
      <select id="model" title="model"></select>
      <button id="slashBtn" class="slash-trigger-btn" type="button" title="명령어 및 스킬 (/)" aria-label="명령어 및 스킬 (/)" aria-haspopup="listbox" aria-expanded="false">/</button>
      <button id="geoBtn" class="geo-trigger-btn" type="button" title="기기 환경 및 위치 정보 동기화 (클릭하여 토글)" aria-label="기기 환경 및 위치 정보 동기화" aria-pressed="false"><svg class="tab-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg></button>
      <textarea id="input" placeholder="메시지를 입력… (/ 입력 시 명령어·스킬)" aria-label="메시지 입력"></textarea>
      <button id="send" class="primary">보내기</button>
    </div>
  </div>

  <div id="artModal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-head">
        <div style="display:flex;align-items:center;gap:.5rem;min-width:0;flex:1">
