<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Sphere · chatbot</title>
  <link rel="icon" href="/chat/persona/face-icon.webp?v=3" type="image/webp" />
  <link rel="stylesheet" href="./sphere-theme.css" />
  <style>
    :root {
      --bg:#0f1115; --bg-card:#22262f; --border:rgba(255,255,255,.08);
      --text:#e8eaed; --muted:#9aa0a6; --accent:#ff8a50; --accent2:#ffa657;
      --radius:12px; --font:"Noto Sans KR",system-ui,sans-serif;
      --app-height: 100dvh;
    }
    *{box-sizing:border-box}
    html, body {
      height: 100%;
      height: var(--app-height, 100dvh);
      overflow: hidden;
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--font)}
    .wrap{
      max-width:960px;
      margin:0 auto;
      padding:1rem 1rem 1.25rem;
      display:flex;
      flex-direction:column;
      gap:.6rem;
      height:100%;
      height:var(--app-height, 100dvh);
      max-height:var(--app-height, 100dvh);
      box-sizing:border-box;
      overflow:hidden;
    }
    header{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;align-items:center;flex-shrink:0}
    .brand{display:flex;align-items:center;gap:.8rem}
    h1{margin:0;font-size:1.35rem}
    .sub{color:var(--muted);font-size:.85rem;margin-top:.15rem}
    .bar{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
    select,button,textarea{font:inherit}
    select,button{background:var(--bg-card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:.45rem .7rem}
    button.primary{background:rgba(255,138,80,.18);border-color:rgba(255,138,80,.45);color:var(--accent2)}
    button:disabled{opacity:.5}
    button.ghost.on{border-color:rgba(255,138,80,.45);color:var(--accent2);background:rgba(255,138,80,.12)}
    .stage{
      position:relative;
      flex:1 1 0;
      min-height:0;
      border:1px solid var(--border);
      border-radius:var(--radius);
      overflow:hidden;
      background:var(--bg-card);
      display:flex;
      flex-direction:column;
    }
    .stage::before{
      content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
      background: url('/chat/persona/half.webp?v=3') center bottom / cover no-repeat;
      opacity:.12; filter:saturate(.85) contrast(.95);
    }
    #log{
      position:relative;
      z-index:1;
      flex:1 1 auto;
      height:100%;
      min-height:0;
      padding:1rem;
      overflow-y:auto;
      overflow-x:hidden;
      display:flex;
      flex-direction:column;
      gap:.75rem;
      background:transparent;
      -webkit-overflow-scrolling:touch;
      scroll-behavior:smooth;
    }
    #activity{
      display:none;
      position:relative;
      z-index:1;
      flex:1 1 auto;
      height:100%;
      min-height:0;
      padding:1rem;
      overflow-y:auto;
      background:rgba(10,12,16,.88);
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:.78rem;
      color:#b7c0cc;
      white-space:pre-wrap;
      -webkit-overflow-scrolling:touch;
    }
    .act-row{margin-bottom:4px;line-height:1.45;word-break:break-word}
    .act-tool{color:#79c0ff;font-weight:600}
    .act-result{color:#8b949e;padding-left:.8rem}
    .act-warn{color:#d29922}
    .act-error{color:#f85149}
    .act-system{color:#d2a8ff}
    .wrap.show-activity #log{display:none}
    .wrap.show-activity #activity{display:block}
    .msg{max-width:92%}
    .msg.user{align-self:flex-end;background:rgba(255,138,80,.12);border:1px solid rgba(255,138,80,.25);padding:.7rem .85rem;border-radius:12px 12px 4px 12px;white-space:pre-wrap}
    .msg.assistant{align-self:flex-start;background:rgba(20,22,28,.78);border:1px solid var(--border);padding:.7rem .85rem;border-radius:12px 12px 12px 4px;backdrop-filter:blur(2px)}
    .msg.assistant .md{white-space:normal;line-height:1.6;word-break:break-word}
    .msg.assistant .md p{margin:.4rem 0 .6rem}
    .msg.assistant .md p:first-child{margin-top:0}
    .msg.assistant .md p:last-child{margin-bottom:0}
    .msg.assistant .md h1, .msg.assistant .md h2, .msg.assistant .md h3, .msg.assistant .md h4{color:#fff;margin:.9rem 0 .4rem;font-weight:600;line-height:1.3}
    .msg.assistant .md h1{font-size:1.25rem;border-bottom:1px solid var(--border);padding-bottom:.3rem}
    .msg.assistant .md h2{font-size:1.15rem}
    .msg.assistant .md h3{font-size:1.02rem;color:var(--accent2)}
    .msg.assistant .md h4{font-size:.95rem}
    .msg.assistant .md ul, .msg.assistant .md ol{margin:.4rem 0 .6rem;padding-left:1.35rem}
    .msg.assistant .md li{margin:.25rem 0}
    .msg.assistant .md blockquote{margin:.6rem 0;padding:.45rem .85rem;border-left:3px solid var(--accent);background:rgba(255,138,80,.07);border-radius:0 8px 8px 0;color:#d8dde4}
    .msg.assistant .md hr{border:0;border-top:1px solid var(--border);margin:.9rem 0}
    .msg.assistant .md table{width:100%;border-collapse:collapse;margin:.65rem 0;font-size:.88rem;border:1px solid var(--border);border-radius:8px;overflow:hidden}
    .msg.assistant .md th, .msg.assistant .md td{border:1px solid var(--border);padding:.5rem .75rem;text-align:left}
    .msg.assistant .md th{background:rgba(255,255,255,.07);color:var(--accent2);font-weight:600}
    .msg.assistant .md tr:nth-child(even){background:rgba(255,255,255,.025)}
    .msg.assistant .md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:rgba(255,255,255,.08);padding:.15rem .35rem;border-radius:4px;color:#ffa657}
    .msg.assistant .md pre{position:relative;overflow:auto;background:#14171d;border:1px solid var(--border);border-radius:8px;padding:.75rem .85rem;margin:.6rem 0}
    .msg.assistant .md pre code{background:none;padding:0;border-radius:0;color:#e8eaed;font-size:.86rem}
    .msg.assistant .md pre .copy-btn{position:absolute;top:6px;right:6px;font-size:.72rem;padding:2px 7px;background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--muted);border-radius:4px;cursor:pointer;opacity:0;transition:opacity .15s ease}
    .msg.assistant .md pre:hover .copy-btn{opacity:1}
    .msg.assistant .md pre .copy-btn:hover{color:#fff;background:rgba(255,255,255,.16)}
    .msg.assistant .md .mermaid-wrap{display:flex;justify-content:center;background:#14171d;border:1px solid var(--border);border-radius:8px;padding:.9rem .5rem;margin:.6rem 0;overflow-x:auto}
    .msg.assistant .md .mermaid-wrap pre.mermaid{background:none;border:none;padding:0;margin:0}
    .msg.assistant .md .mermaid-wrap svg{max-width:100%;height:auto}
    .msg.assistant .md img{max-width:100%;border-radius:8px;border:1px solid var(--border);margin:.4rem 0;box-shadow:0 4px 12px rgba(0,0,0,.3)}
    .msg.assistant .md a{color:var(--accent2);text-decoration:underline;text-underline-offset:3px}
    .composer{position:relative;display:flex;gap:.5rem;flex-shrink:0;align-items:flex-end}
    .slash-menu{position:absolute;bottom:calc(100% + 8px);left:0;right:0;max-height:250px;background:#181b22;border:1px solid rgba(255,138,80,.45);border-radius:12px;box-shadow:0 -8px 28px rgba(0,0,0,.65);overflow-y:auto;z-index:100;display:flex;flex-direction:column;padding:.35rem 0;backdrop-filter:blur(10px)}
    .slash-menu[hidden]{display:none !important}
    .slash-category{font-size:.7rem;color:#ffa657;padding:.4rem .75rem .2rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid rgba(255,255,255,.06);margin-top:.2rem}
    .slash-category:first-child{margin-top:0}
    .slash-item{display:flex;align-items:center;gap:.55rem;padding:.45rem .75rem;cursor:pointer;transition:background .12s ease;user-select:none}
    .slash-item:hover,.slash-item.selected{background:rgba(255,138,80,.2)}
    .slash-badge{font-size:.68rem;padding:1px 5px;border-radius:4px;font-weight:600;flex-shrink:0}
    .slash-badge.cmd{background:rgba(255,138,80,.2);color:#ffa657;border:1px solid rgba(255,138,80,.35)}
    .slash-badge.skill{background:rgba(52,211,153,.18);color:#34d399;border:1px solid rgba(52,211,153,.35)}
    .slash-name{font-family:ui-monospace,monospace;font-size:.84rem;font-weight:600;color:#fff;flex-shrink:0}
    .slash-desc{font-size:.76rem;color:#9aa0a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:right;margin-left:auto}
    .slash-item.selected .slash-desc{color:#d8dde4}
    .slash-empty{padding:.75rem;text-align:center;color:#9aa0a6;font-size:.82rem}
    textarea{
      flex:1;
      min-height:42px;
      height:42px;
      max-height:120px;
      resize:none;
      background:#1a1d24;
      color:var(--text);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.5rem .75rem;
      font-size:16px;
      line-height:1.35;
      box-sizing:border-box;
      overflow-y:hidden;
      transition:height .1s ease;
    }
    .composer button{
      height:42px;
      padding:0 1rem;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      flex-shrink:0;
    }
    .slash-trigger-btn{
      width:42px;
      min-width:42px;
      padding:0 !important;
      background:rgba(255,255,255,.06);
      border:1px solid var(--border);
      color:var(--muted);
      font-family:ui-monospace,monospace;
      font-size:1.15rem;
      font-weight:700;
      cursor:pointer;
      transition:all .15s ease;
      user-select:none;
    }
    .slash-trigger-btn:hover, .slash-trigger-btn.active{
      background:rgba(255,138,80,.18);
      border-color:rgba(255,138,80,.45);
      color:var(--accent2);
    }
    #micBtn.listening{
      background:rgba(255,70,70,.22);
      border-color:rgba(255,70,70,.6);
      color:#ff6a6a;
      animation:mic-pulse 1.1s ease-in-out infinite;
    }
    @keyframes mic-pulse{
      0%,100%{box-shadow:0 0 0 0 rgba(255,70,70,.45)}
      50%{box-shadow:0 0 0 6px rgba(255,70,70,0)}
    }
    .tts-row{margin-top:.4rem;padding-top:.35rem;border-top:1px dashed var(--border)}
    .tts-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:.78rem;padding:.2rem .55rem;border-radius:20px;transition:all .15s ease}
    .tts-btn:hover{color:var(--accent2);border-color:rgba(255,138,80,.4);background:rgba(255,138,80,.1)}
    .tts-btn.speaking{color:var(--accent2);background:rgba(255,138,80,.15);border-color:rgba(255,138,80,.4)}
    .meta{color:var(--muted);font-size:.8rem;flex-shrink:0}
    a{color:var(--accent2)}
    .progress{font-size:.82rem;color:var(--accent2);min-height:1.2rem;opacity:.95;flex-shrink:0}
    .progress[hidden]{display:none}
    button.danger{background:rgba(248,81,73,.18);border:1px solid rgba(248,81,73,.45);color:#f85149;cursor:pointer}
    button.danger:hover{background:rgba(248,81,73,.28);color:#fff}
    button.btw-btn{background:rgba(147,112,219,.28)!important;border-color:rgba(147,112,219,.6)!important;color:#d8b4fe!important}
    button.btw-btn:hover{background:rgba(147,112,219,.45)!important;color:#fff!important}
    button.queue-btn{background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.2)!important;color:var(--muted)!important}
    .session-banner{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.55rem .75rem;border-radius:10px;border:1px solid rgba(255,168,87,.45);background:rgba(255,138,80,.12);color:var(--accent2);font-size:.88rem;flex-shrink:0}
    .session-banner[hidden]{display:none!important}
    .session-banner.hard{border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.12);color:#f85149}
    .session-banner .session-banner-msg{flex:1;min-width:12rem}
    .session-banner button{cursor:pointer}
    button.queue-btn:hover{background:rgba(255,255,255,.14)!important;color:var(--text)!important}
    .msg.btw-card{align-self:stretch;margin:.4rem 0;background:rgba(147,112,219,.09);border:1px solid rgba(147,112,219,.28);border-radius:12px;padding:.75rem .9rem}
    .msg.btw-card .btw-head{font-size:.84rem;color:#d8b4fe;margin-bottom:.4rem;display:flex;align-items:center;gap:.4rem}
    .msg.btw-card .btw-head .btw-q{color:var(--muted);font-weight:normal;font-size:.8rem}
    .msg.btw-card .btw-body{font-size:.9rem;line-height:1.55}
    .msg.user.queued{opacity:.75;border-style:dashed}
    .msg.user.queued::after{content:" (대기열 대기 중)";font-size:.75rem;color:var(--accent2);margin-left:.4rem}
    .msg.user.btw-user{border-color:rgba(147,112,219,.45);background:rgba(147,112,219,.12)}
    .msg.user.btw-user::before{content:"[BTW] ";font-weight:bold;color:#d8b4fe}
    header .avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:center 18%;border:1px solid rgba(255,255,255,.12);flex-shrink:0}
    .tab-group{display:inline-flex;align-items:center;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:10px;padding:2px;gap:2px}
    .tab-btn{background:transparent;color:var(--muted);border:none;border-radius:8px;padding:.38rem .65rem;cursor:pointer;font-size:.84rem;transition:all .15s ease}
    .tab-btn:hover{color:var(--text);background:rgba(255,255,255,.05)}
    .tab-btn.on{color:var(--accent2);background:rgba(255,138,80,.16);font-weight:600}
    .badge{font-size:.7rem;background:var(--accent);color:#fff;padding:1px 5px;border-radius:10px;font-weight:700;margin-left:3px;vertical-align:middle;display:inline-block}
    .badge:empty{display:none}
    #artifacts{display:none;position:relative;z-index:1;flex:1 1 auto;height:100%;min-height:0;padding:1rem;overflow-y:auto;flex-direction:column;gap:.9rem;-webkit-overflow-scrolling:touch}
    #statusPane{display:none;position:relative;z-index:1;flex:1 1 auto;height:100%;min-height:0;padding:1rem;overflow-y:auto;flex-direction:column;gap:1rem;-webkit-overflow-scrolling:touch}
    .status-toolbar{display:flex;justify-content:flex-end}
    .status-section h2{margin:0 0 .55rem;font-size:.92rem;color:var(--accent2)}
    .status-list{display:flex;flex-direction:column;gap:.5rem}
    .status-item{background:rgba(20,22,28,.85);border:1px solid var(--border);border-radius:10px;padding:.6rem .75rem;display:flex;flex-direction:column;gap:.35rem}
    .status-item-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
    .status-item-name{font-weight:600;font-size:.88rem}
    .status-item-meta{color:var(--muted);font-size:.76rem}
    .status-item-preview{color:var(--muted);font-size:.78rem;white-space:pre-wrap;word-break:break-all}
    .status-item-actions{display:flex;gap:.4rem;flex-shrink:0}
    .status-edit-area{width:100%;min-height:220px;max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#14171d;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.6rem;font-family:ui-monospace,Consolas,monospace;font-size:.82rem;resize:vertical}
    .status-toggle{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:.2rem .7rem;font-size:.76rem;cursor:pointer}
    .status-toggle.on{background:rgba(120,220,150,.15);border-color:rgba(120,220,150,.4);color:#8fe0a8}
    .status-toggle.off{background:rgba(255,255,255,.05);color:var(--muted)}
    .status-hint{color:var(--muted);font-size:.8rem;line-height:1.5}
    .status-mcp-add{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
    .status-mcp-add input{flex:1 1 160px;background:var(--bg-card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.4rem .6rem;font-size:.82rem}
    .art-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;border-bottom:1px solid var(--border);padding-bottom:.6rem;flex-shrink:0}
    .art-filters{display:flex;gap:.35rem}
    .art-filter-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:.25rem .55rem;font-size:.78rem;cursor:pointer;transition:all .15s}
    .art-filter-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
    .art-filter-btn.on{background:rgba(255,138,80,.15);border-color:rgba(255,138,80,.4);color:var(--accent2);font-weight:600}
    .art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.85rem}
    .art-card{background:rgba(20,22,28,.85);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s ease,border-color .15s ease}
    .art-card:hover{transform:translateY(-2px);border-color:rgba(255,138,80,.35)}
    .art-thumb-wrap{width:100%;height:135px;background:#14171d;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;position:relative}
    .art-thumb{width:100%;height:100%;object-fit:cover;transition:transform .2s ease}
    .art-thumb-wrap:hover .art-thumb{transform:scale(1.04)}
    .art-file-icon{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted)}
    .art-file-ext{font-size:.72rem;text-transform:uppercase;background:rgba(255,255,255,.08);padding:2px 6px;border-radius:4px;color:var(--accent2);font-weight:600}
    .art-info{padding:.6rem .75rem;flex:1;display:flex;flex-direction:column;gap:.25rem}
    .art-name{font-size:.84rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .art-sub{font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
    .art-actions{display:flex;gap:.35rem;padding:.45rem .65rem;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
    .art-btn{flex:1;text-align:center;font-size:.74rem;padding:.3rem .35rem;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
    .art-btn:hover{background:rgba(255,255,255,.14);color:#fff}
    .art-btn.primary{background:rgba(255,138,80,.18);border-color:rgba(255,138,80,.4);color:var(--accent2)}
    .art-empty{text-align:center;padding:3.5rem 1rem;color:var(--muted);font-size:.95rem;line-height:1.6}
    .modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1rem}
    .modal-card{background:#181b22;border:1px solid rgba(255,255,255,.15);border-radius:14px;max-width:92vw;max-height:92vh;width:760px;display:flex;flex-direction:column;box-shadow:0 12px 36px rgba(0,0,0,.5);overflow:hidden}
    .modal-head{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--border)}
    .modal-body{flex:1;overflow:auto;padding:1rem;display:flex;justify-content:center;align-items:center;background:#0f1115;min-height:240px}
    .modal-body img{max-width:100%;max-height:70vh;object-fit:contain;border-radius:6px}
    .modal-body pre{width:100%;max-height:68vh;overflow:auto;background:#14171d;padding:1rem;border-radius:8px;font-family:monospace;font-size:.82rem;color:#e8eaed;white-space:pre-wrap;margin:0}
    .modal-foot{display:flex;justify-content:flex-end;gap:.6rem;padding:.75rem 1rem;border-top:1px solid var(--border)}

    @media (max-width: 640px) {
      .wrap{
        padding:.35rem .5rem calc(max(.35rem, env(safe-area-inset-bottom)));
        gap:.35rem;
      }
      header{
        gap:.3rem;
      }
      header .avatar{
        width:34px;
        height:34px;
      }
      .brand{
        gap:.5rem;
      }
      h1{
        font-size:1.05rem;
        line-height:1.2;
      }
      .sub{
        display:none;
      }
      .bar{
        gap:.25rem;
        margin-left:auto;
      }
      .bar a{
        font-size:.78rem;
        padding:.25rem .45rem;
      }
      select,button{
        padding:.3rem .5rem;
        font-size:.8rem;
        border-radius:8px;
      }
      .tab-group{
        padding:1px;
        border-radius:8px;
        gap:1px;
      }
      .tab-btn{
        padding:.25rem .42rem;
        font-size:.76rem;
        border-radius:6px;
      }
      .meta{
        font-size:.72rem;
        line-height:1.2;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
      }
      .session-banner{
        padding:.35rem .5rem;
        font-size:.78rem;
      }
      .stage{
        border-radius:10px;
      }
      #log{
        padding:.6rem .6rem;
        gap:.55rem;
      }
      .msg{
        max-width:96%;
        font-size:.9rem;
      }
      .msg.user, .msg.assistant{
        padding:.5rem .65rem;
      }
      .composer{
        gap:.35rem;
      }
      textarea{
        min-height:38px;
        height:38px;
        max-height:90px;
        padding:.45rem .65rem;
        font-size:16px;
        line-height:1.35;
        border-radius:10px;
      }
      .composer button{
        height:38px;
        padding:0 .75rem;
        font-size:.85rem;
        border-radius:10px;
      }
      .slash-trigger-btn{
        width:38px;
        min-width:38px;
        font-size:1.05rem;
        border-radius:10px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap" id="appWrap">
    <header>
      <div class="brand">
        <img class="avatar" src="/chat/persona/face-icon.webp?v=3" alt="냥피디" onerror="this.onerror=null;this.src='//'+location.hostname+'/chat/persona/face-icon.png';">
        <div>
          <h1 style="margin:0">냥피디</h1>
          <div class="sub">Sphere chatbot · DiskStation</div>
        </div>
      </div>
      <div class="bar">
        <a id="hubLink" href="/">← Hub</a>
        <select id="model" title="model"></select>
        <div class="tab-group" role="tablist">
          <button id="tabChat" class="tab-btn on" type="button">💬 대화</button>
          <button id="tabArtifacts" class="tab-btn" type="button">📁 아티팩트 <span id="artBadge" class="badge"></span></button>
          <button id="tabActivity" class="tab-btn" type="button">📜 로그</button>
          <button id="tabStatus" class="tab-btn" type="button">⚙ 상태</button>
        </div>
        <button id="continueSession" class="ghost" type="button" title="현재 대화의 핵심 맥락을 요약 인계받아 새 세션을 시작합니다">이어하기 ✦</button>
        <button id="defibBtn" class="ghost" type="button" title="전기충격 · 심폐소생 — 호스트 repair">⚡ 소생</button>
        <button id="newSession" class="primary">새 세션</button>
      </div>
    </header>
    <div class="meta" id="meta">세션 없음</div>
    <div id="sessionBanner" class="session-banner" hidden>
      <span class="session-banner-msg">세션이 길어져서 느려질 수 있어요. 새 채팅을 권장합니다</span>
      <button id="sessionBannerContinue" class="primary" type="button">맥락 이어 새 대화 ✦</button>
      <button id="sessionBannerNew" class="ghost" type="button">완전 새 세션</button>
      <button id="sessionBannerDismiss" class="ghost" type="button">닫기</button>
    </div>
    <div class="progress" id="progress" hidden></div>
    <div class="stage">
      <div id="log"></div>
      <div id="artifacts">
        <div class="art-toolbar">
          <div class="art-filters">
            <button class="art-filter-btn on" data-filter="all" type="button">전체</button>
            <button class="art-filter-btn" data-filter="image" type="button">이미지</button>
            <button class="art-filter-btn" data-filter="document" type="button">문서/코드</button>
          </div>
          <button id="artRefreshBtn" class="art-filter-btn" type="button" title="아티팩트 새로고침">새로고침 ↻</button>
        </div>
        <div id="artGrid" class="art-grid"></div>
        <div id="artEmpty" class="art-empty" style="display:none">
          생성된 아티팩트가 없습니다냥 ฅ<br><span style="font-size:.85rem;color:var(--muted)">이미지 생성이나 파일 작업을 요청해보세요!</span>
        </div>
      </div>
      <div id="activity"></div>
      <div id="statusPane">
        <div class="status-toolbar">
          <button id="statusRefreshBtn" class="art-filter-btn" type="button" title="상태 새로고침">새로고침 ↻</button>
        </div>
        <section class="status-section">
          <h2>📋 규칙 파일 (Rules)</h2>
          <div id="statusRules" class="status-list"></div>
        </section>
        <section class="status-section">
          <h2>🧩 프로젝트 스킬 (Skills)</h2>
          <div id="statusSkills" class="status-list"></div>
          <div class="status-hint" id="statusSkillLibHint"></div>
        </section>
        <section class="status-section">
          <h2>🔌 MCP 서버</h2>
          <div id="statusMcp" class="status-list"></div>
          <div class="status-mcp-add">
            <input id="mcpNameInput" type="text" placeholder="이름 (예: graft)">
            <input id="mcpUrlInput" type="text" placeholder="serverUrl (예: http://127.0.0.1:PORT/mcp)">
            <button id="mcpAddBtn" class="art-btn primary" type="button">+ 추가</button>
          </div>
        </section>
        <section class="status-section">
          <h2>🪝 훅 (Hooks) &amp; 플러그인</h2>
          <div id="statusHooks" class="status-hint"></div>
        </section>
        <section class="status-section">
          <h2>🔭 task-observer</h2>
          <div id="statusObserver" class="status-hint"></div>
        </section>
      </div>
    </div>
    <div class="composer">
      <div id="slashMenu" class="slash-menu" hidden></div>
      <button id="slashBtn" class="slash-trigger-btn" type="button" title="명령어 및 스킬 (/)">/</button>
      <button id="micBtn" class="slash-trigger-btn" type="button" title="음성 입력">🎤</button>
      <textarea id="input" placeholder="메시지를 입력… (/ 입력 시 명령어·스킬)"></textarea>
      <button id="send" class="primary">보내기</button>
      <button id="stopBtn" class="danger" style="display:none" type="button">중지</button>
    </div>
  </div>

  <div id="artModal" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <div class="modal-head">
        <span id="modalTitle" style="font-weight:600;font-size:.95rem">아티팩트 미리보기</span>
        <button id="modalClose" class="ghost" type="button" style="cursor:pointer">✕ 닫기</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-foot">
        <a id="modalDownload" href="#" download target="_blank" class="art-btn" style="text-align:center">다운로드 ⤓</a>
        <button id="modalCite" class="art-btn primary" type="button">채팅에 인용 💬</button>
      </div>
    </div>
  </div>
  <script src="./vendor/marked.min.js"></script>
  <script src="./vendor/mermaid.min.js"></script>
  <script src="./app.js?v=12"></script>
</body>
</html>
