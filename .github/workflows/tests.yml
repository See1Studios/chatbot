# The test suite on Linux, Windows and macOS (docs/plans/platform-portability.md pp/F, PP3).
# Linux runs on every push to main. Windows and macOS minutes cost more (2x and 10x), so they run once a day when
# main changed, and on demand (Actions -> tests -> Run workflow). tools/run_modules.py runs the suite without bash.
name: tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"   # 03:17 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    # which systems run this time: a push runs Linux; the daily run runs all three when something landed on main in
    # the last day, else none; a manual run runs all three
    runs-on: ubuntu-latest
    outputs:
      oses: ${{ steps.pick.outputs.oses }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: pick
        run: |
          all='["ubuntu-latest","windows-latest","macos-latest"]'
          case "${{ github.event_name }}" in
            push) oses='["ubuntu-latest"]' ;;
            schedule) if [ -n "$(git log --since='25 hours ago' --format=%h -1)" ]; then oses="$all"; else oses='[]'; fi ;;
            *) oses="$all" ;;
          esac
          echo "oses=$oses" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.oses != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.oses) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@localhost"
      - name: Run the suite
        run: python tools/run_modules.py --json results-${{ matrix.os }}.json
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: results-${{ matrix.os }}.json
